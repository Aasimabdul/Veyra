name: Android CI
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "9.6.0"   # minimum Gradle for AGP 9.5.0
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;${BUILD_TOOLS_VERSION}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Show toolchain diagnostics
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed
          gradle --version
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          test -s "$apk"
          ls -l "$apk"
          aapt2="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt2"
          "$aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label):"
          "$aapt2" dump badging "$apk" | grep -q "package: name='com.veyra.browser'"
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-android-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace
      - name: Android lint
        working-directory: android
        run: gradle lintDebug --stacktrace
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-lint-report-${{ github.run_number }}
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

name: Android CI
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "9.6.0"   # minimum Gradle for AGP 9.5.0
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;${BUILD_TOOLS_VERSION}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Show toolchain diagnostics
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed
          gradle --version
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          dir=android/app/build/outputs/apk/debug
          tools="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          aapt2="$tools/aapt2"
          apksigner="$tools/apksigner"
          zipalign="$tools/zipalign"
          max_bytes=$((150 * 1024 * 1024))   # per-APK size limit: 150 MB
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="$dir/app-$abi-debug.apk"
            test -s "$apk"
            size=$(stat -c %s "$apk")
            echo "== $abi: $(ls -lh "$apk" | awk '{print $5}') ($size bytes)"
            unzip -l "$apk" | grep -E "lib/[^/]+/libxul.so" || true
            "$aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code):"
            "$aapt2" dump badging "$apk" | grep -q "package: name='com.veyra.browser'"
            # Catch malformed, misaligned, or unsigned/corrupt APKs before publishing artifacts.
            "$zipalign" -c -v 4 "$apk"
            "$apksigner" verify --verbose --print-certs "$apk"
            case "$abi" in
              arm64-v8a) "$aapt2" dump badging "$apk" | grep -q "native-code: 'arm64-v8a'" ;;
              armeabi-v7a) "$aapt2" dump badging "$apk" | grep -q "native-code: 'armeabi-v7a'" ;;
              x86_64) "$aapt2" dump badging "$apk" | grep -q "native-code: 'x86_64'" ;;
            esac
            if [ "$size" -gt "$max_bytes" ]; then
              echo "::error::$apk is larger than 150 MB"; exit 1
            fi
          done
          ls -lh "$dir"/*.apk
      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -camera-back none -camera-front none
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -euo pipefail
            apk="android/app/build/outputs/apk/debug/app-x86_64-debug.apk"
            test -s "$apk"
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb install -r "$apk"
            adb shell am start -W -n com.veyra.browser/.MainActivity
            sleep 8
            adb shell pidof com.veyra.browser
            if adb logcat -d -t 5000 | grep -E "FATAL EXCEPTION|Fatal signal"; then
              echo "::error::Veyra crashed during emulator smoke test"
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-arm64-v8a-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-armeabi-v7a-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-x86_64-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace
      - name: Android lint
        working-directory: android
        run: gradle lintDebug --stacktrace
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-lint-report-${{ github.run_number }}
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

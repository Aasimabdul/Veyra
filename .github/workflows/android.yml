name: Android CI
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "9.6.0"   # minimum Gradle for AGP 9.5.0
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;${BUILD_TOOLS_VERSION}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Show toolchain diagnostics
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed
          gradle --version
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          dir=android/app/build/outputs/apk/debug
          tools="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          aapt2="$tools/aapt2"
          apksigner="$tools/apksigner"
          zipalign="$tools/zipalign"
          max_bytes=$((150 * 1024 * 1024))   # per-APK size limit: 150 MB
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="$dir/app-$abi-debug.apk"
            test -s "$apk"
            size=$(stat -c %s "$apk")
            echo "== $abi: $(ls -lh "$apk" | awk '{print $5}') ($size bytes)"
            unzip -l "$apk" | grep -E "lib/[^/]+/libxul.so" || true
            "$aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code):"
            "$aapt2" dump badging "$apk" | grep -q "package: name='com.veyra.browser'"
            # Catch malformed, misaligned, or unsigned/corrupt APKs before publishing artifacts.
            "$zipalign" -c -v 4 "$apk"
            "$apksigner" verify --verbose --print-certs "$apk"
            case "$abi" in
              arm64-v8a) "$aapt2" dump badging "$apk" | grep -q "native-code: 'arm64-v8a'" ;;
              armeabi-v7a) "$aapt2" dump badging "$apk" | grep -q "native-code: 'armeabi-v7a'" ;;
              x86_64) "$aapt2" dump badging "$apk" | grep -q "native-code: 'x86_64'" ;;
            esac
            if [ "$size" -gt "$max_bytes" ]; then
              echo "::error::$apk is larger than 150 MB"; exit 1
            fi
          done
          ls -lh "$dir"/*.apk
      - name: Grant the runner access to KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable; the Android emulator smoke test requires KVM."
            exit 1
          fi
          sudo chown "$(id -un)" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -camera-back none -camera-front none
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          script: |
            test -s "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-x86_64-debug.apk"
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-x86_64-debug.apk"
            adb shell am start -W -n com.veyra.browser/.MainActivity
            sleep 8
            if ! adb shell pidof com.veyra.browser; then adb logcat -b crash -d | head -60; adb logcat -d | grep -iE "AndroidRuntime|FATAL|Caused by|at com.veyra|Fatal signal|am_proc_died|am_kill|lowmemorykiller|DEBUG|tombstone|ActivityManager.*(died|kill)|Process .* has died" | head -80; exit 1; fi
            if adb logcat -b crash -d | grep -E "com\.veyra\.browser"; then echo "::error::Veyra crashed during emulator smoke test"; exit 1; fi
            mkdir -p "$GITHUB_WORKSPACE/shots"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_page home
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/home.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_page search
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/search.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_page tabs
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/tabs.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_page bookmarks
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/bookmarks.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_page history
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/history.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_page downloads
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/downloads.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_page settings
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/settings.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_page lock
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/lock.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_download https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf
            sleep 12
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/download.png"
            adb shell ls -l /sdcard/Download/Veyra
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --ez veyra_private true --es veyra_url https://example.com
            sleep 15
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/private-browser.png"
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_page tabs
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/tabs-private.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_page appearance
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/appearance.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_page privacy
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/privacy.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_theme arctic
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/home-arctic.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_theme violet
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/home-violet.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_theme crimson
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/home-crimson.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_page private
            sleep 3
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/private-space.png"
            adb shell am force-stop com.veyra.browser
            adb shell am start -W -n com.veyra.browser/.MainActivity --es veyra_url https://example.com
            sleep 15
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/browser.png"
      - name: Publish UI screenshots to ci-screenshots branch
        if: always() && github.ref == 'refs/heads/main' && hashFiles('shots/*.png') != ''
        run: |
          cd shots
          git init -q
          git checkout -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "UI screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-ui-screenshots-${{ github.run_number }}
          path: shots/*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-arm64-v8a-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-armeabi-v7a-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-x86_64-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace
      - name: Android lint
        working-directory: android
        run: gradle lintDebug --stacktrace
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-lint-report-${{ github.run_number }}
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

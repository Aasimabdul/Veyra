name: Android Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_VERSION: "9.6.0"
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;${BUILD_TOOLS_VERSION}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Validate signing secrets and prepare keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing required repository Actions secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing required repository Actions secret: ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Missing required repository Actions secret: ANDROID_KEY_ALIAS"
            exit 1
          fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing required repository Actions secret: ANDROID_KEY_PASSWORD"
            exit 1
          fi
          keystore="$RUNNER_TEMP/veyra-release.jks"
          # Tolerate whitespace, line wraps and CRLF that get pasted into the secret box.
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. It must contain the base64 text of the keystore FILE contents (e.g. 'base64 -w0 veyra-release.jks'), not a file path, the keystore password, or the .jks pasted as raw text."
            exit 1
          fi
          if [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          # Confirm it is a real keystore and that the alias + passwords match (secrets are read from env, never printed).
          if ! keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Decoded file is not a readable keystore, or ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS do not match it."
            exit 1
          fi
          echo "Keystore decoded and alias verified."
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APKs and Android App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease :app:testDebugUnitTest :app:lintRelease --stacktrace

      - name: Verify signed release artifacts
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          dir="android/app/build/outputs/apk/release"
          expected_cert=""
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="$dir/app-$abi-release.apk"
            test -s "$apk"
            "$tools/aapt2" dump badging "$apk" | grep -q "package: name='com.veyra.browser'"
            "$tools/aapt2" dump badging "$apk" | grep -q "native-code: '$abi'"
            "$tools/zipalign" -c -v 4 "$apk"
            cert_output=$("$tools/apksigner" verify --verbose --print-certs "$apk")
            printf '%s\n' "$cert_output"
            cert=$(printf '%s\n' "$cert_output" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')
            test -n "$cert"
            if [ -z "$expected_cert" ]; then
              expected_cert="$cert"
            elif [ "$cert" != "$expected_cert" ]; then
              echo "::error::Release APKs were signed with different certificates"
              exit 1
            fi
          done
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab"
          jarsigner -verify "$aab"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$aab" | grep -q "base/lib/$abi/libxul.so"
          done
          ls -lh "$dir"/*.apk "$aab"

      - name: Grant the runner access to KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable; the release emulator smoke test requires KVM."
            exit 1
          fi
          sudo chown "$(id -un)" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install and launch signed release APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -camera-back none -camera-front none
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          script: |
            test -s "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-x86_64-release.apk"
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-x86_64-release.apk"
            adb shell am start -W -n com.veyra.browser/.MainActivity
            sleep 8
            if ! adb shell pidof com.veyra.browser; then adb logcat -b crash -d | head -60; adb logcat -d | grep -iE "AndroidRuntime|FATAL|Caused by|at com.veyra|Fatal signal|am_proc_died|am_kill|lowmemorykiller|DEBUG|tombstone|ActivityManager.*(died|kill)|Process .* has died" | head -80; exit 1; fi
            if adb logcat -b crash -d | grep -E "com\.veyra\.browser"; then echo "::error::Veyra release APK crashed during emulator smoke test"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: veyra-signed-release-candidate-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

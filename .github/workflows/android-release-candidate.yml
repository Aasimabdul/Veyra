name: Android Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_VERSION: "9.6.0"
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;${BUILD_TOOLS_VERSION}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Validate signing secrets and prepare keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository Actions secret: $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/veyra-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APKs and Android App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify signed release artifacts
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          dir="android/app/build/outputs/apk/release"
          expected_cert=""
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="$dir/app-$abi-release.apk"
            test -s "$apk"
            "$tools/aapt2" dump badging "$apk" | grep -q "package: name='com.veyra.browser'"
            "$tools/aapt2" dump badging "$apk" | grep -q "native-code: '$abi'"
            "$tools/zipalign" -c -v 4 "$apk"
            cert_output=$("$tools/apksigner" verify --verbose --print-certs "$apk")
            printf '%s\n' "$cert_output"
            cert=$(printf '%s\n' "$cert_output" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')
            test -n "$cert"
            if [ -z "$expected_cert" ]; then
              expected_cert="$cert"
            elif [ "$cert" != "$expected_cert" ]; then
              echo "::error::Release APKs were signed with different certificates"
              exit 1
            fi
          done
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab"
          jarsigner -verify "$aab"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$aab" | grep -q "base/lib/$abi/libxul.so"
          done
          ls -lh "$dir"/*.apk "$aab"

      - uses: actions/upload-artifact@v4
        with:
          name: veyra-signed-release-candidate-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
